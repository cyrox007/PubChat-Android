name: Android CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firebase: [disabled, enabled]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Verify checkout has no Firebase configuration
        run: test ! -e app/google-services.json
      - name: Create synthetic Firebase configuration
        if: matrix.firebase == 'enabled'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # Build-only fixture: no real Firebase project or credentials.
          config = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "pubchat-ci-placeholder",
                  "storage_bucket": "pubchat-ci-placeholder.appspot.com",
              },
              "client": [
                  {
                      "client_info": {
                          "mobilesdk_app_id": f"1:123456789012:android:{index:016x}",
                          "android_client_info": {"package_name": package},
                      },
                      "api_key": [{"current_key": "CI_PLACEHOLDER_NOT_A_REAL_API_KEY"}],
                  }
                  for index, package in enumerate(
                      ["ru.pubchat.app", "ru.pubchat.app.debug"], start=1
                  )
              ],
              "configuration_version": "1",
          }
          Path("app/google-services.json").write_text(json.dumps(config))
          PY
      - name: Verify Gradle configuration and optional plugin resolution
        env:
          FIREBASE_MODE: ${{ matrix.firebase }}
        run: |
          ./gradlew help :app:tasks --all :app:buildEnvironment --stacktrace > firebase-configuration.txt
          cat firebase-configuration.txt
          if [ "$FIREBASE_MODE" = enabled ]; then
            grep -q 'com.google.gms:google-services:4.4.2' firebase-configuration.txt
            grep -q 'processDebugGoogleServices' firebase-configuration.txt
          else
            ! grep -q 'com.google.gms:google-services' firebase-configuration.txt
            ! grep -q 'processDebugGoogleServices' firebase-configuration.txt
          fi
      - name: Verify Firebase resources for debug and release
        if: matrix.firebase == 'enabled'
        run: |
          ./gradlew :app:processDebugGoogleServices :app:processReleaseGoogleServices --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for variant, index in [("debug", 2), ("release", 1)]:
              resources = list(Path(f"app/build/generated/res/google-services/{variant}").rglob("values.xml"))
              assert resources, f"Missing generated Firebase resources for {variant}"
              values = {
                  item.attrib.get("name"): item.text
                  for path in resources
                  for item in ET.parse(path).getroot()
              }
              assert values["google_app_id"] == f"1:123456789012:android:{index:016x}"
              assert values["project_id"] == "pubchat-ci-placeholder"
          PY
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
