name: Android CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firebase: [disabled, enabled]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Verify checkout has no Firebase configuration
        run: test ! -e app/google-services.json
      - name: Create synthetic Firebase configuration
        if: matrix.firebase == 'enabled'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # Build-only fixture: no real Firebase project or credentials.
          config = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "pubchat-ci-placeholder",
                  "storage_bucket": "pubchat-ci-placeholder.appspot.com",
              },
              "client": [
                  {
                      "client_info": {
                          "mobilesdk_app_id": f"1:123456789012:android:{index:016x}",
                          "android_client_info": {"package_name": package},
                      },
                      "api_key": [{"current_key": "CI_PLACEHOLDER_NOT_A_REAL_API_KEY"}],
                  }
                  for index, package in enumerate(
                      ["ru.pubchat.app", "ru.pubchat.app.debug"], start=1
                  )
              ],
              "configuration_version": "1",
          }
          Path("app/google-services.json").write_text(json.dumps(config))
          PY
      - name: Verify Gradle configuration and optional plugin resolution
        env:
          FIREBASE_MODE: ${{ matrix.firebase }}
        run: |
          ./gradlew help :app:tasks --all :app:buildEnvironment --stacktrace > firebase-configuration.txt
          cat firebase-configuration.txt
          if [ "$FIREBASE_MODE" = enabled ]; then
            grep -q 'com.google.gms:google-services:4.4.2' firebase-configuration.txt
            grep -q 'processDebugGoogleServices' firebase-configuration.txt
          else
            if grep -Eq 'com.google.gms:google-services|process(Debug|Release)GoogleServices' firebase-configuration.txt; then
              echo 'Firebase plugin must not be resolved or applied without configuration'
              exit 1
            fi
          fi
      - name: Verify Firebase resources for debug and release
        if: matrix.firebase == 'enabled'
        run: |
          ./gradlew :app:processDebugGoogleServices :app:processReleaseGoogleServices --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # AGP chooses the task output directory; inspect the generated XML.
          resources = list(Path("app/build/generated/res").rglob("values.xml"))
          values = [
              {
                  item.attrib.get("name"): item.text
                  for item in ET.parse(path).getroot()
              }
              for path in resources
          ]
          for variant, index in [("debug", 2), ("release", 1)]:
              assert any(
                  item.get("google_app_id") == f"1:123456789012:android:{index:016x}"
                  and item.get("project_id") == "pubchat-ci-placeholder"
                  for item in values
              ), f"Missing or incorrect Firebase resources for {variant}: {resources}"
          PY
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      # This debug APK is signed by a throwaway runner key, NOT the permanent
      # device-QA identity. It can be installed fresh / side by side with the
      # release application but will not reliably upgrade an older debug APK.
      - name: Publish disposable debug APK for first-install tests
        if: matrix.firebase == 'disabled' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pubchat-debug-FIRST-INSTALL-ONLY
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Real device QA must use one stable signing certificate on every run.
  # Runs only on trusted master pushes, after BOTH existing CI matrix legs pass.
  # When QA secrets are absent no misleading "upgradeable" APK is published.
  signed-device-qa:
    name: Signed Android device QA APK
    needs: [android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check optional persistent signing configuration
        id: signing
        env:
          QA_KEYSTORE_B64: ${{ secrets.PUBCHAT_QA_KEYSTORE_B64 }}
          PUBCHAT_QA_STORE_PASSWORD: ${{ secrets.PUBCHAT_QA_STORE_PASSWORD }}
          PUBCHAT_QA_KEY_ALIAS: ${{ secrets.PUBCHAT_QA_KEY_ALIAS }}
          PUBCHAT_QA_KEY_PASSWORD: ${{ secrets.PUBCHAT_QA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$QA_KEYSTORE_B64" && -z "$PUBCHAT_QA_STORE_PASSWORD" &&
                -z "$PUBCHAT_QA_KEY_ALIAS" && -z "$PUBCHAT_QA_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No permanent QA signing key configured; only the disposable first-install APK is available."
          elif [[ -z "$QA_KEYSTORE_B64" || -z "$PUBCHAT_QA_STORE_PASSWORD" ||
                  -z "$PUBCHAT_QA_KEY_ALIAS" || -z "$PUBCHAT_QA_KEY_PASSWORD" ]]; then
            echo "::error::QA signing secrets are partially configured. Supply all four, or none."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore QA keystore outside the repository
        if: steps.signing.outputs.configured == 'true'
        env:
          QA_KEYSTORE_B64: ${{ secrets.PUBCHAT_QA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$QA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pubchat-qa-signing.jks"
          test -s "$RUNNER_TEMP/pubchat-qa-signing.jks"

      - name: Build permanently signed QA APK
        if: steps.signing.outputs.configured == 'true'
        env:
          PUBCHAT_QA_STORE_PASSWORD: ${{ secrets.PUBCHAT_QA_STORE_PASSWORD }}
          PUBCHAT_QA_KEY_ALIAS: ${{ secrets.PUBCHAT_QA_KEY_ALIAS }}
          PUBCHAT_QA_KEY_PASSWORD: ${{ secrets.PUBCHAT_QA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # This grows across master runs, unlike Gradle's default versionCode=1.
          BUILD_CODE=$((100000 + GITHUB_RUN_NUMBER))
          ./gradlew :app:assembleDebug --stacktrace \
            "-PPUBCHAT_QA_KEYSTORE_PATH=$RUNNER_TEMP/pubchat-qa-signing.jks" \
            "-PPUBCHAT_TEST_VERSION_CODE=$BUILD_CODE"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/qa-apk-verification.txt"
          grep -q 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/qa-apk-verification.txt"
          awk '/Signer #1 certificate SHA-256 digest:/ {
            print "Signing certificate SHA-256:", $NF
          }' "$RUNNER_TEMP/qa-apk-verification.txt" > QA_SIGNING_CERT.txt
          sha256sum "$APK" > QA_APK_SHA256.txt
          echo "Verified signed QA APK, package ru.pubchat.app.debug, build code $BUILD_CODE"
          cat QA_SIGNING_CERT.txt

      - name: Publish upgradable signed Android QA APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pubchat-device-qa-signed
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            QA_SIGNING_CERT.txt
            QA_APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored signing material
        if: always() && steps.signing.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/pubchat-qa-signing.jks"
